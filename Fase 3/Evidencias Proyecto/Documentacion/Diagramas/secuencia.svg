<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#20364d"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="48" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#142b45">Secuencia de captura offline, sync y supervisión</text><text x="40" y="77" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#526579">Flujo actual · reintentos idempotentes y revisión de hallazgos</text><text x="140" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b45">Trabajador / PWA</text><line x1="140" y1="145" x2="140" y2="790" stroke="#9aaaba" stroke-dasharray="7 7"/><text x="400" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b45">Dexie + worker</text><line x1="400" y1="145" x2="400" y2="790" stroke="#9aaaba" stroke-dasharray="7 7"/><text x="680" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b45">API NestJS</text><line x1="680" y1="145" x2="680" y2="790" stroke="#9aaaba" stroke-dasharray="7 7"/><text x="980" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b45">PostgreSQL + volumen</text><line x1="980" y1="145" x2="980" y2="790" stroke="#9aaaba" stroke-dasharray="7 7"/><text x="1260" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b45">Supervisor / Gerencia</text><line x1="1260" y1="145" x2="1260" y2="790" stroke="#9aaaba" stroke-dasharray="7 7"/><line x1="140" y1="185" x2="400" y2="185" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="270" y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Guardar formulario, foto y firma en local</text><line x1="140" y1="240" x2="400" y2="240" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="270" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">UUIDv7 en outbox · pending</text><text x="680" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a96b10">Modo avión: captura continúa en el dispositivo</text><line x1="400" y1="330" x2="680" y2="330" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="540" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Al volver la señal: POST /sync/batch</text><line x1="680" y1="390" x2="980" y2="390" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="830" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Validar tenant · RLS · upsert idempotente</text><line x1="980" y1="450" x2="680" y2="450" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="830" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Registrar SyncLog y conflictos completos</text><line x1="680" y1="510" x2="400" y2="510" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="540" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Respuesta por registro</text><line x1="400" y1="570" x2="140" y2="570" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="270" y="564" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Marcar synced o retener failed + backoff</text><line x1="1260" y1="650" x2="680" y2="650" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="970" y="644" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Consultar evidencia y hallazgos</text><line x1="680" y1="710" x2="1260" y2="710" stroke="#20364d" stroke-width="2" marker-end="url(#a)"/><text x="970" y="704" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20364d">Guardar asignación/avance/cierre auditado</text><rect x="65" y="755" width="1270" height="43" rx="10" fill="#eef4f7" stroke="#cbd5df"/><text x="700" y="782" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#142b45">Resultado: supervisión ve la captura sincronizada y PostgreSQL aplica el aislamiento.</text></svg>