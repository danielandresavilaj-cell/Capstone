<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#243b53"/></marker></defs><rect width="1100" height="830" fill="white"/><text x="120" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Trabajador / PWA</text><line x1="120" y1="60" x2="120" y2="800" stroke="#888" stroke-dasharray="6 5"/><text x="380" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">IndexedDB / outbox</text><line x1="380" y1="60" x2="380" y2="800" stroke="#888" stroke-dasharray="6 5"/><text x="650" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">API NestJS</text><line x1="650" y1="60" x2="650" y2="800" stroke="#888" stroke-dasharray="6 5"/><text x="960" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">PostgreSQL / archivos</text><line x1="960" y1="60" x2="960" y2="800" stroke="#888" stroke-dasharray="6 5"/><line x1="120" y1="100" x2="380" y2="100" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="128" y="88" font-family="Arial" font-size="17">1. Guardar borrador, respuestas y foto</text><line x1="120" y1="168" x2="380" y2="168" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="128" y="156" font-family="Arial" font-size="17">2. Enviar: crear pendientes con UUIDv7</text><line x1="380" y1="236" x2="120" y2="236" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="128" y="224" font-family="Arial" font-size="17">3. Confirmar guardado local (sin red)</text><line x1="120" y1="304" x2="650" y2="304" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="128" y="292" font-family="Arial" font-size="17">4. Red recuperada y modo manual habilitado</text><line x1="380" y1="372" x2="650" y2="372" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="388" y="360" font-family="Arial" font-size="17">5. POST /api/v1/sync/batch</text><line x1="650" y1="440" x2="960" y2="440" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="658" y="428" font-family="Arial" font-size="17">6. Validar tenant y aplicar upsert por UUID</text><line x1="650" y1="508" x2="960" y2="508" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="658" y="496" font-family="Arial" font-size="17">7. Persistir adjuntos y confirmar transacción</text><line x1="960" y1="576" x2="650" y2="576" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="658" y="564" font-family="Arial" font-size="17">8. Resultado por registro</text><line x1="650" y1="644" x2="380" y2="644" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="388" y="632" font-family="Arial" font-size="17">9. Marcar confirmados; conservar fallidos</text><line x1="120" y1="712" x2="650" y2="712" stroke="#243b53" stroke-width="2" marker-end="url(#a)"/><text x="128" y="700" font-family="Arial" font-size="17">10. Supervisor consulta detalle por trabajador</text></svg>